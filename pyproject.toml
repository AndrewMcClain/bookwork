[project]
name = "bookwork"
version = "0.2.0"
description = "Cross-platform PDF imposition tool for booklet/signature printing"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
readme = "README.md"
authors = [
    { name = "Andrew McClain", email = "andrew.c.mcclain@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "pyside6>=6.11.2",
]

[project.scripts]
bookwork = "bookwork:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.14.0",
    "commitizen>=4.0.0",
]

[tool.ruff]
# The code was written around this width; ruff's 88 default would reflow
# nearly every file for no benefit.
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# pep8-naming on top of the defaults. Qt requires camelCase for its overrides
# (paintEvent, mousePressEvent, ...), which is why those carry an explicit
# `noqa: N802` — enabling N is what makes those comments meaningful rather
# than dead.
extend-select = ["N"]

[tool.ruff.lint.per-file-ignores]
# Asserting is the entire point of a test, and tests deliberately poke at
# private helpers to check geometry and cache behaviour.
"tests/*" = ["S101", "SLF001"]

[tool.ruff.format]
# ruff's "auto" default infers the ending from the first line break, so a file
# converted wholesale to CRLF passes the check — which is how PR #7 turned a
# 26-line change into a 309-line whole-file diff. Pinning to lf makes that a
# CI failure instead of a review problem.
line-ending = "lf"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = true
# Pre-1.0: a breaking change bumps the minor, not to 1.0. Drop this once the
# imposition parameters and preset format are considered settled.
major_version_zero = true
# Everything earlier predates Conventional Commits and would only add noise.
changelog_start_rev = "580efa6"
