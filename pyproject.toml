[project]
name = "bookwork"
version = "0.1.0"
description = "Cross-platform PDF imposition tool for booklet/signature printing"
license = {text = "GPL-3.0-only"}
readme = "README.md"
authors = [
    { name = "Andrew McClain", email = "andrew.c.mcclain@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "pyside6>=6.11.2",
]

[project.scripts]
bookwork = "bookwork:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]
